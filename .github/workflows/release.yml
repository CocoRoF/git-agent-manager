name: Release
# Publishes to npm when a version tag is pushed. Uses npm trusted publishing, so no token is stored:
# on npmjs.com, add this repo and this workflow file as a trusted publisher for git-agent-manager.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: dist matches the source
        run: git diff --exit-code --stat dist
      - name: tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --access public --provenance
